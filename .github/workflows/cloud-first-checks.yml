name: Ward39 cloud-first checks

on:
  push:
    branches:
      - feature/online-only-clinical-cloud
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript type check
        run: bun run tsc --noEmit
      - name: Production build
        run: bun run build
